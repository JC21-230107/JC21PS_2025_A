#バリデーションエラーメッセージ
NotBlank={0}の入力は必須です。
Pattern={0}は半角英数字で入力してください。
Size={0}は{1}文字以内で入力してください。
NotNull={0}の入力は必須です。
Pattern.activityStartTime={0}の形式が無効です。例: 14:30
Pattern.activityEndTime={0}の形式が無効です。例: 18:00
AssertTrue.dateValid=活動開始時間は終了時間より以前の時間を入力してください。
AssertTrue.activityDateValid=活動日は明日以降で入力してください。
Pattern.maxParticipant={0}は半角数字で入力してください。
Min={0}は{1}人以上を入力してください。
Max={0}は{1}人以下を入力してください。
